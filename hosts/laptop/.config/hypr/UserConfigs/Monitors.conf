# See https://wiki.hyprland.org/Configuring/Monitors/
#monitor=,preferred,auto,auto

# The main screen. This is a monitorv2 block, and not a "monitor =" line. The
# keys sdr_min_luminance and sdr_max_luminance exist in monitorv2 only. A
# monitorv2 block replaces every "monitor =" rule for the same output, so the
# mode, the position and the scale also belong here. This matches the HDR
# scheme of hosts/desktop.
monitorv2 {
  output = eDP-1
  mode = 2560x1600@165
  position = 0x0
  scale = 1
  #bitdepth = 10
  # The value auto. The preset rests at srgb, and it changes to HDR for
  # fullscreen HDR content only.
  cm = auto
  # The sdr keys below apply while the output is in HDR only.
  sdrbrightness = 1.2
  sdrsaturation = 0.9
  # SDR black goes to 0 nits. The default is 0.2 nits, and that value looks
  # grey.
  sdr_min_luminance = 0
  # SDR white. The default is 80 nits. This panel is the 500-nit HDR400 IPS
  # option of the 16ITHg6 chassis. Tune this value by eye between 150 and
  # 250 nits.
  sdr_max_luminance = 200
}

# Lenovo portable screen
monitor = DP-2, preferred, auto, 1
monitor = DP-4, preferred, auto, 1

# ASUS ultrawide at home
#monitor = HDMI-A-1, preferred, auto, 1
monitor = HDMI-A-1, preferred, auto, 1, mirror, eDP-1



# Assign workspaces
workspace = 1, monitor:eDP-1



