# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# User Settings
# This is where you put your own settings as this will not be touched during update 
# if the upgrade.sh is used.

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/

# NOTE: some settings are in ~/.config/hypr/UserConfigs/UserDecorAnimations.conf

general {
    layout = dwindle
    resize_on_border = true
}

dwindle {
    force_split = 2
    smart_split = false
    preserve_split = true
    use_active_for_splits = true
    default_split_ratio = 1
}

master {
    allow_small_split = true
    mfact = 0.42
    orientation = left
    new_status = slave
    smart_resizing = true

    new_on_top = false
    new_on_active = before
    #inherit_fullscreen = true

    drop_at_cursor = true
}


input {
  kb_layout = us,fi
#  kb_variant =
#  kb_model =
  #kb_options = grp:alt_shift_toggle
  kb_rules =
  repeat_rate = 50
  repeat_delay = 300

  # Funny change, this makes the left SUPER key and
  # left ALT to change places
  kb_options = altwin:swap_lalt_lwin, grp:ctrls_toggle
  #kb_options = grp:ctrls_toggle


  sensitivity = 0 #mouse sensitivity
  #accel_profile =     # flat or adaptive or blank or EMPTY means libinput’s default mode
  numlock_by_default = true
  left_handed = false
  follow_mouse = 1
  mouse_refocus = true
  float_switch_override_focus = false

  touchpad {
    disable_while_typing = true
    natural_scroll = false 
    clickfinger_behavior = false
    middle_button_emulation = true
    tap-to-click = true
    drag_lock = false
  }
  
  # below for devices with touchdevice ie. touchscreen
	touchdevice {
		enabled = true
	}
	
	# below is for table see link above for proper variables
	tablet {
		transform = 0
		left_handed = 0
	}
}

gestures {
  workspace_swipe_distance = 500
  workspace_swipe_invert = true
  workspace_swipe_min_speed_to_force = 30
  workspace_swipe_cancel_ratio = 0.5
  workspace_swipe_create_new = true 
  workspace_swipe_forever = true
  #workspace_swipe_use_r = true #uncomment if wanted a forever create a new workspace with swipe right
}


misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  #vfr = true
  vrr = 2
  mouse_move_enables_dpms = true
  enable_swallow = true
  swallow_regex = ^(foot)$
  focus_on_activate = false
  initial_workspace_tracking = 0
  middle_click_paste = false
}

opengl {
  nvidia_anti_flicker = true
}

binds {
  workspace_back_and_forth = true
  allow_workspace_cycles = true
  pass_mouse_when_bound = false
}

#Could help when scaling and not pixelating
xwayland {
  enabled = true
  force_zero_scaling = true
}


# render section for Hyprland >= v0.42.0
render {
  	#explicit_sync_kms = 2
  # Applies to iGPU-rendered fullscreen content only: video and lighter native
  # titles, not nvidia-offload games. This host is PRIME offload with the panel
  # on the iGPU (system/hardware/nvidia_prime_power.nix, and the four commented
  # nvidia-primary variables in ENV-Variables.conf), so a dGPU-rendered buffer
  # is cross-GPU and cannot be scanned out directly. Switching the BIOS MUX to
  # Discrete removes that limit.
  direct_scanout = true

  # Always-on HDR, matching hosts/desktop. The monitor line in Monitors.conf
  # carries "cm, hdr" plus "bitdepth, 10"; cm_enabled turns the colour-
  # management pipeline on globally, required for that preset to take effect.
  # sdrbrightness/sdrsaturation on the same monitor line (1.2/0.9) compensate
  # SDR content; retune by eye if desktop content looks off. sdr_min_luminance/
  # min_luminance (both 0) stop the HDR tone-map floor from lifting SDR black
  # to grey; raise both together if black starts clipping shadow detail instead.
  #
  # Unverified on this hardware: whether eDP-1's EDID carries an ST2084 PQ EOTF
  # bit, idle battery cost under TLP (system/hardware/power.nix) with cm_enabled
  # permanently on, and how the panel behaves while Monitors.conf mirrors
  # HDMI-A-1 onto it. Check all three after switching.
  cm_enabled = true
}

# Colour-management protocol clients negotiate through, matching hosts/desktop.
experimental {
  wp_cm_1_2 = true
}

cursor {
  sync_gsettings_theme = true
  no_hardware_cursors = false
  enable_hyprcursor = true
  warp_on_change_workspace = 2
  #no_warps = true 
}
