# User settings for this host. Put the settings of this machine here.

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/

# NOTE: some settings are in ~/.config/hypr/UserConfigs/UserDecorAnimations.conf

general {
    layout = dwindle
    resize_on_border = true
}

dwindle {
    force_split = 2
    smart_split = false
    preserve_split = true
    use_active_for_splits = true
    default_split_ratio = 1
}

master {
    allow_small_split = true
    mfact = 0.42
    orientation = left
    new_status = slave
    smart_resizing = true

    new_on_top = false
    new_on_active = before
    #inherit_fullscreen = true

    drop_at_cursor = true
}


input {
  kb_layout = us,fi
#  kb_variant =
#  kb_model =
  #kb_options = grp:alt_shift_toggle
  kb_rules =
  repeat_rate = 50
  repeat_delay = 300

  # Funny change, this makes the left SUPER key and
  # left ALT to change places
  kb_options = altwin:swap_lalt_lwin, grp:ctrls_toggle
  #kb_options = grp:ctrls_toggle


  sensitivity = 0 #mouse sensitivity
  #accel_profile =     # flat or adaptive or blank or EMPTY means libinput’s default mode
  numlock_by_default = true
  left_handed = false
  follow_mouse = 1
  mouse_refocus = true
  float_switch_override_focus = false

  touchpad {
    disable_while_typing = true
    natural_scroll = false 
    clickfinger_behavior = false
    middle_button_emulation = true
    tap-to-click = true
    drag_lock = false
  }
  
  # below for devices with touchdevice ie. touchscreen
	touchdevice {
		enabled = true
	}
	
	# below is for table see link above for proper variables
	tablet {
		transform = 0
		left_handed = 0
	}
}

gestures {
  workspace_swipe_distance = 500
  workspace_swipe_invert = true
  workspace_swipe_min_speed_to_force = 30
  workspace_swipe_cancel_ratio = 0.5
  workspace_swipe_create_new = true 
  workspace_swipe_forever = true
  #workspace_swipe_use_r = true #uncomment if wanted a forever create a new workspace with swipe right
}


misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  #vfr = true
  vrr = 2
  mouse_move_enables_dpms = true
  enable_swallow = true
  swallow_regex = ^(foot)$
  focus_on_activate = false
  initial_workspace_tracking = 0
  middle_click_paste = false
}

opengl {
  nvidia_anti_flicker = true
}

binds {
  workspace_back_and_forth = true
  allow_workspace_cycles = true
  pass_mouse_when_bound = false
}

#Could help when scaling and not pixelating
xwayland {
  enabled = true
  force_zero_scaling = true
}


# render section for Hyprland >= v0.42.0
render {
  	#explicit_sync_kms = 2
  # This option applies to fullscreen content from the iGPU only: video and
  # lighter native programs. It does not apply to a game that starts with
  # nvidia-offload.
  # This host uses PRIME offload, and the panel runs on the iGPU. See
  # system/hardware/nvidia_prime_power.nix and the 4 commented
  # nvidia-primary variables in ENV-Variables.conf.
  # A buffer from the dGPU therefore crosses between 2 GPUs, and the display
  # controller cannot read it directly. A change of the BIOS MUX to Discrete
  # removes that limit.
  direct_scanout = true

  # HDR stays on, like hosts/desktop. The monitor line in Monitors.conf
  # holds "cm, hdr" and "bitdepth, 10". cm_enabled starts the colour
  # management pipeline globally, and that preset needs it.
  # sdrbrightness and sdrsaturation on the same monitor line hold 1.2 and
  # 0.9. They correct SDR content. Tune them by eye if the desktop content
  # looks wrong.
  # sdr_min_luminance and min_luminance both hold 0. They stop the HDR tone
  # map floor from lifting SDR black to grey. Raise both values together if
  # black starts to hide the detail in a shadow.
  #
  # Three points are open on this hardware. Check all three:
  #  - Does the EDID of eDP-1 carry an ST2084 PQ EOTF bit?
  #  - What does cm_enabled cost in idle battery time under TLP? See
  #    system/hardware/power.nix.
  #  - How does the panel behave while Monitors.conf mirrors HDMI-A-1 onto
  #    it?
  cm_enabled = true
}

# The colour management protocol. A client negotiates through it. This
# matches hosts/desktop.
experimental {
  wp_cm_1_2 = true
}

cursor {
  sync_gsettings_theme = true
  no_hardware_cursors = false
  enable_hyprcursor = true
  warp_on_change_workspace = 2
  #no_warps = true 
}
