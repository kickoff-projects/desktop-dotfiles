# User settings for this host. Put the settings of this machine here.

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/

# NOTE: some settings are in ~/.config/hypr/UserConfigs/UserDecorAnimations.conf

general {
    layout = dwindle
    resize_on_border = true
}

dwindle {
    force_split = 2
    smart_split = false
    preserve_split = true
    use_active_for_splits = true
    default_split_ratio = 1
}

master {
    allow_small_split = true
    mfact = 0.42
    orientation = left
    new_status = slave
    smart_resizing = true

    new_on_top = false
    new_on_active = before
    #inherit_fullscreen = true

    drop_at_cursor = true
}


input {
  kb_layout = us,fi
#  kb_variant =
#  kb_model =
  kb_rules =
  repeat_rate = 50
  repeat_delay = 300

  # Funny change, this makes the left SUPER key and
  # left ALT to change places
  kb_options = altwin:swap_lalt_lwin, grp:ctrls_toggle
  #kb_options = grp:alt_shift_toggle


  sensitivity = 0 #mouse sensitivity
  #accel_profile =     # flat or adaptive or blank or EMPTY means libinput’s default mode
  numlock_by_default = true
  left_handed = false
  follow_mouse = 1
  mouse_refocus = true
  float_switch_override_focus = false

  # This block does nothing here, because this host has no touchpad. It
  # matches hosts/laptop.
  touchpad {
    disable_while_typing = true
    natural_scroll = false 
    clickfinger_behavior = false
    middle_button_emulation = true
    tap-to-click = true
    drag_lock = false
  }
  
  # below for devices with touchdevice ie. touchscreen
	touchdevice {
		enabled = true
	}
	
	# below is for table see link above for proper variables
	tablet {
		transform = 0
		left_handed = 0
	}
}

gestures {
  workspace_swipe_distance = 500
  workspace_swipe_invert = true
  workspace_swipe_min_speed_to_force = 30
  workspace_swipe_cancel_ratio = 0.5
  workspace_swipe_create_new = true 
  workspace_swipe_forever = true
  #workspace_swipe_use_r = true #uncomment if wanted a forever create a new workspace with swipe right
}


misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  vrr = 2
  mouse_move_enables_dpms = true
  enable_swallow = true
  swallow_regex = ^(foot)$
  focus_on_activate = false
  initial_workspace_tracking = 0
  middle_click_paste = false
}

opengl {
  nvidia_anti_flicker = true
}

binds {
  workspace_back_and_forth = true
  allow_workspace_cycles = true
  pass_mouse_when_bound = false
}

#Could help when scaling and not pixelating
xwayland {
  enabled = true
  force_zero_scaling = true
}


# render section for Hyprland >= v0.42.0
render {
  	#explicit_sync_kms = 2
  # This option gives the buffer of a fullscreen game directly to the
  # display controller, with no composition. Run "hyprctl monitors" to
  # check it: directScanoutTo names the window when the window is alone.
  direct_scanout = true

  # HDR on demand. The monitorv2 block in Monitors.conf sets "cm = auto".
  # colorManagementPreset therefore rests at srgb, and it changes to HDR for
  # fullscreen HDR content. cm_auto_hdr makes that change, and it reads the
  # surface metadata through the wp_cm_1_2 protocol below.
  # cm_enabled starts the colour management pipeline globally. The cm preset
  # of the monitor needs it. The sdr keys in that block apply while the
  # output is in HDR.
  #
  # srgb at rest also allows brightness control through ddcutil. This panel
  # refuses a DDC write while it is in HDR, and it has no backlight class
  # device. See common/.config/hypr/scripts/brightness.sh.
  #
  # A game sends HDR only with DXVK_HDR=1 and ENABLE_HDR_WSI=1 in its own
  # environment. Neither variable is global.
  cm_enabled = true
}

# The colour management protocol. A client negotiates through it.
# cm_auto_hdr needs it to see that a surface is HDR.
# This protocol is experimental. Look at the electron applications and the
# chromium applications first if the screen shows something wrong.
experimental {
  wp_cm_1_2 = true
}

cursor {
  sync_gsettings_theme = true
  no_hardware_cursors = false
  enable_hyprcursor = true
  warp_on_change_workspace = 2
  #no_warps = true 
}
