# See https://wiki.hyprland.org/Configuring/Monitors/
#monitor=,preferred,auto,auto

# Main screen. ASUS VG34V, 3440x1440 across 34.5" (~109 ppi), so scale stays
# at 1 like the Laptop even though that panel is ~188 ppi - see the px sizes
# in .config/waybar/style.css for how the bar is matched to this one.
# A monitorv2 block, not a "monitor =" line: sdr_min_luminance and
# sdr_max_luminance exist only as monitorv2 keys. A monitorv2 block replaces any
# "monitor =" rule for the same output, so the mode, position and scale belong
# here too.
monitorv2 {
  output = DP-3
  mode = 3440x1440@165
  position = 0x0
  scale = 1
  #bitdepth = 10
  # Auto: the preset idles at srgb and switches to HDR only for fullscreen HDR
  # content. srgb is also what allows ddcutil brightness control, which the
  # monitor blocks while it is in HDR - see
  # common/.config/hypr/scripts/brightness.sh.
  cm = auto
  # The sdr keys below apply only while the output is in HDR.
  sdrbrightness = 1.0
  sdrsaturation = 1.0
  # SDR black maps to 0 nits, not the 0.2-nit default that reads as grey.
  sdr_min_luminance = 0
  # SDR white. The default is 80 nits. Tune by eye in the 150-250 range.
  sdr_max_luminance = 200
}

# The other connectors on the RTX 3070 (nothing plugged into them right now,
# these only kick in when something is). This mirrors what hosts/laptop does
# for its external outputs.
#monitor = DP-1, preferred, auto, 1
#monitor = DP-3, preferred, auto, 1
#monitor = HDMI-A-1, preferred, auto, 1

