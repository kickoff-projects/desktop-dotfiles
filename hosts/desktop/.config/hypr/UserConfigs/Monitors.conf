# See https://wiki.hyprland.org/Configuring/Monitors/
#monitor=,preferred,auto,auto

# The main screen. The ASUS VG34V gives 3440 by 1440 pixels across 34.5
# inches, which is near 109 ppi. The scale therefore stays at 1, like the
# laptop. The laptop panel is near 188 ppi. Read the pixel sizes in
# .config/waybar/style.css for the match between the bar and this screen.
#
# This is a monitorv2 block, and not a "monitor =" line. The keys
# sdr_min_luminance and sdr_max_luminance exist in monitorv2 only. A
# monitorv2 block replaces every "monitor =" rule for the same output, so
# the mode, the position and the scale also belong here.
monitorv2 {
  output = DP-3
  mode = 3440x1440@165
  position = 0x0
  scale = 1
  #bitdepth = 10
  # The value auto. The preset rests at srgb, and it changes to HDR for
  # fullscreen HDR content only. srgb also allows brightness control
  # through ddcutil. The monitor refuses that control while it is in HDR.
  # See common/.config/hypr/scripts/brightness.sh.
  cm = auto
  # The sdr keys below apply while the output is in HDR only.
  sdrbrightness = 0.85
  sdrsaturation = 1.4
  # SDR black goes to 0 nits. The default is 0.2 nits, and that value looks
  # grey.
  sdr_min_luminance = 10
  # SDR white. The default is 80 nits. Tune this value by eye between 150
  # and 250 nits.
  sdr_max_luminance = 60
}

# The other connectors on the RTX 3070. No cable is in them now, and these
# lines apply only after a user connects one. hosts/laptop uses the same
# lines for its external outputs.
#monitor = DP-1, preferred, auto, 1
#monitor = DP-3, preferred, auto, 1
#monitor = HDMI-A-1, preferred, auto, 1

# Assign the workspaces. The laptop holds workspace 1 on its own panel in
# the same way.
#workspace = 1, monitor:DP-2

# Earlier multi monitor setup, kept for when the other screens come back
#monitor = HDMI-A-1, 2560x1440@144, 0x0, 1, transform, 1
#monitor = DP-1, 1920x1080@144, 4880x250, 1, transform, 3
#workspace = 2, monitor:HDMI-A-1
#workspace = 3, monitor:DP-1

# Assign fifth worspace for games
# and lock it to be the main monitor
#workspace = 5, monitor:DP-2

# Mirrored monitors (never forget Fontys 2026 prp presentation :holding_back_tears:)
# https://wiki.hypr.land/0.41.2/Configuring/Monitors/
#monitor = HDMI-A-1, preferred, auto, 1, mirror, DP-2
