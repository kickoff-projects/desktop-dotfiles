# See https://wiki.hyprland.org/Configuring/Monitors/
#monitor=,preferred,auto,auto

# Main screen. ASUS VG34V, 3440x1440 across 34.5" (~109 ppi), so scale stays
# at 1 like the Laptop even though that panel is ~188 ppi - see the px sizes
# in .config/waybar/style.css for how the bar is matched to this one.
monitor = DP-3, 3440x1440@165, 0x0, 1

# The other connectors on the RTX 3070 (nothing plugged into them right now,
# these only kick in when something is). This mirrors what hosts/Home-Laptop does
# for its external outputs.
#monitor = DP-1, preferred, auto, 1
#monitor = DP-3, preferred, auto, 1
#monitor = HDMI-A-1, preferred, auto, 1

# Assign workspaces, same as the Laptop pinning workspace 1 to its panel
#workspace = 1, monitor:DP-2

# Earlier multi monitor setup, kept for when the other screens come back
#monitor = HDMI-A-1, 2560x1440@144, 0x0, 1, transform, 1
#monitor = DP-1, 1920x1080@144, 4880x250, 1, transform, 3
#workspace = 2, monitor:HDMI-A-1
#workspace = 3, monitor:DP-1

# Assign fifth worspace for games
# and lock it to be the main monitor
#workspace = 5, monitor:DP-2

# Mirrored monitors (never forget Fontys 2026 prp presentation :holding_back_tears:)
# https://wiki.hypr.land/0.41.2/Configuring/Monitors/
#monitor = HDMI-A-1, preferred, auto, 1, mirror, DP-2
