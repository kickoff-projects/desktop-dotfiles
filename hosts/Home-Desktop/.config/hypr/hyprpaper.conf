#! /bin/bash

# Same wallpaper the Laptop uses, only the path differs: this repo is checked
# out as ~/desktop-dotfiles here, while the Laptop reads it from ~/.dotfiles.
# fit_mode = cover crops it to the 21:9 panel instead of letterboxing.
wallpaper {
    monitor =
    path = /home/nansus/desktop-dotfiles/system/wallpaper/Under_Starlit_Sky.png
    fit_mode = cover
}

#wallpaper {
