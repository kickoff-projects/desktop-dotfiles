# wallust-colors
include /home/nansus/.config/kitty/kitty-colors.conf 

#font_family FantasqueSansM Nerd Font Mono Bold
# No font_family here, same as the Laptop: kitty resolves "monospace" through
# fontconfig, which system/base/fonts.nix points at FiraCode Nerd Font.
# 11.0 instead of the Laptop's 12.0 because this host's 34.5" 3440x1440 panel
# is ~109 ppi against the laptop's ~188 ppi, so identical pt renders bigger.
font_size 11.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity 1

confirm_os_window_close 0

# change to x11 or wayland or leave auto
linux_display_server wayland

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 0

#selection_foreground none
#selection_background none

#foreground #dddddd
#background #000000
cursor #dddddd
