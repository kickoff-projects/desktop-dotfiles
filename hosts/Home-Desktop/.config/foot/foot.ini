# -*- conf -*-

#shell=/run/current-system/sw/bin/zsh

[main]
# Colors: each account's own, from common/.config/foot/colors.ini or a
# host/user layer's override of it.
include=~/.config/foot/colors.ini

#font=FiraCode Nerd Font Mono:size=10,Noto Color Emoji:size=10

#font=Iosevka:style=Bold:size=10
#font=FiraCode Nerd Font Mono:size=12   
#font-bold=Iosevka:style=Bold:size=10
#font-italic=Iosevka:style=Italic:size=10
#font-bold-italic=Iosevka:style=Bold Italic:size=10

# size=11 where the Laptop has 12: foot sizes fonts off the output scale
# factor (1 on both hosts), so the same pt lands on the same pixel height,
# and this host's 34.5" 3440x1440 panel is ~109 ppi against the laptop's
# ~188 ppi. Same adjustment as kitty.conf.
font=FiraCode Nerd Font Mono:size=11
font-bold=FiraCode Nerd Font Mono:size=11
font-italic=FiraCode Nerd Font Mono:size=11
font-bold-italic=FiraCode Nerd Font Mono:size=11




# testing new stuff
# -----------
underline-offset=4px
strikeout-thickness=1px
pad=10x5
line-height=20px
# ----------

[scrollback]
lines=10000

[key-bindings]
clipboard-copy=Control+c XF86Copy
clipboard-paste=Control+v XF86Paste

#scrollback-up-page=Shift+Up
#scrollback-down-page=Shift+Down
#scrollback-up-line=Control+Shift+Up
#scrollback-down-line=Control+Shift+Down

[search-bindings]
cancel=Control+g Control+Shift+c Escape

[url-bindings]
cancel=Control+g Control+Shift+c Control+d Escape

[cursor]
style=block
unfocused-style=hollow


[mouse]
hide-when-typing=true

[tweak]
font-monospace-warn=no
