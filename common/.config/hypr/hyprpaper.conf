#! /bin/bash

# The value "fit_mode = cover" cuts the image to the size of the panel. It
# adds no black bars.
# The path is ~/.config/wallpaper. It comes from common/.config/wallpaper
# through xdg.configFile. The path is the same on every account, and it does
# not depend on the location of the repository.
wallpaper {
    monitor =
    path = ~/.config/wallpaper/Under_Starlit_Sky.png
    fit_mode = cover
}

#wallpaper {
#    monitor =
#    path = ~/.config/wallpaper/Drawn_Space.jpg
#    fit_mode = cover
#}

splash = false
