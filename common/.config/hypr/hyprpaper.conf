#! /bin/bash

# fit_mode = cover crops to the panel instead of letterboxing. Path is
# ~/.config/wallpaper (xdg.configFile from common/.config/wallpaper), which
# is the same on every account regardless of where the repo is checked out -
# this used to point at /home/nansus/.dotfiles or /home/nansus/desktop-dotfiles
# depending on the host, so it silently failed on whichever didn't match.
wallpaper {
    monitor =
    path = ~/.config/wallpaper/Under_Starlit_Sky.png
    fit_mode = cover
}

#wallpaper {
#    monitor =
#    path = ~/.config/wallpaper/Drawn_Space.jpg
#    fit_mode = cover
#}

splash = false
