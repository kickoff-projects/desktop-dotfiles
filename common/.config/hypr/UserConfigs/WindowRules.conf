# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# windowrule v2 - tags - add apps under appropriate tag to use the same settings
# browser tags
windowrule = tag +browser, match:class ([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr)$
windowrule = tag +browser, match:class ([Gg]oogle-chrome(-beta|-dev|-unstable)?)$
windowrule = tag +browser, match:class ^(chrome-.+-Default)$ # Chrome PWAs
windowrule = tag +browser, match:class ^([Cc]hromium)$
windowrule = tag +browser, match:class ^([Mm]icrosoft-edge(-stable|-beta|-dev|-unstable))$
windowrule = tag +browser, match:class ^(Brave-browser(-beta|-dev|-unstable)?)$
windowrule = tag +browser, match:class ^([Tt]horium-browser|[Cc]achy-browser)$
windowrule = tag +browser, match:class ^(zen-alpha|zen)$

# IM tags
windowrule = tag +im, match:class ^([Dd]iscord|[Ww]ebCord|[Vv]esktop)$

# game tags
windowrule = tag +games, match:class ^(gamescope)$
windowrule = tag +games, match:class ^(steam_app_\d+)$

# gamestore tags
windowrule = tag +gamestore, match:class ^([Ss]team)$

# file-manager tags
windowrule = tag +file-manager, match:class ^([Tt]hunar)$

# settings tags
windowrule = tag +settings, match:class ^(nm-connection-editor|qt5ct|qt6ct)$

# windowrule v2 move to workspace
#windowrule = workspace 2, match:tag browser*
#windowrule = workspace 3, match:class ^([Tt]hunar)$
windowrule = workspace 5, match:tag gamestore*
windowrule = workspace 7, match:tag im*
windowrule = workspace 8, match:tag games*

# Borders

# Disable border for inactive window
windowrule = border_size 0, match:focus 0

# FLOAT
#
# The default is tile. The rule "float 0, match:class .*" below tiles every
# window. A rule lower in the file wins, so each float exception goes BELOW
# that rule.
# Geometry needs its own rules. The rules "center", "size", "move" and "pin"
# apply to a floating window only.
#
# Neither rule reaches a client that floats itself. Hyprland 0.55.4 has no
# rule that overrides a float from the client. proton.vpn.app.gtk floats
# itself, so it stays floating with the Proton rule below and without it.
#
# Other likely float candidates, ready to paste below the catch-all:
#
#   # polkit / sudo password prompts: modal, and tiling one shuffles the layout
#   windowrule = float 1, match:title ^(Authentication Required)$
#   windowrule = center 1, match:title ^(Authentication Required)$
#
#   # GTK/Qt file choosers: awkwardly small at a tiled size
#   windowrule = float 1, match:initial_title (Open Files)
#   windowrule = size 70% 60%, match:initial_title (Open Files)
#
#   # Picture-in-Picture: pin and keep_aspect_ratio further down this file take
#   # effect only once it floats
#   windowrule = float 1, match:title ^(Picture-in-Picture)$
#   windowrule = move 72% 7%, match:title ^(Picture-in-Picture)$
#   windowrule = size 25% 25%, match:title ^(Picture-in-Picture)$
windowrule = float 0, match:class .*

# The Proton applications float. This rule matches proton.vpn.app.gtk. It
# also matches the "Proton <name>" class of the other Proton applications.
windowrule = float 1, match:class ^[Pp]roton.*

# OPACITY
windowrule = opacity 0.9 0.7, match:tag browser*
windowrule = opacity 0.94 0.86, match:tag im*
windowrule = opacity 0.9 0.8, match:tag file-manager*
windowrule = opacity 0.8 0.7, match:tag settings*
windowrule = opacity 0.95 0.75, match:title ^(Picture-in-Picture)$

# GAMES
# No compositing effects on a game window. The tags are above: gamescope and
# steam_app_<id>.
# These rules hold no tearing rule. Hardware cursors are on, because
# cursor:no_hardware_cursors is false. "hyprctl monitors" then keeps
# "hw cursor" in tearingBlockedBy. allow_tearing with an "immediate" rule
# therefore reads as active and does nothing. misc:vrr = 2 already controls
# the frame pacing.
windowrule = no_blur 1, match:tag games*
windowrule = no_shadow 1, match:tag games*
windowrule = rounding 0, match:tag games*
windowrule = no_anim 1, match:tag games*
windowrule = no_dim 1, match:tag games*
# Games open windowed, not fullscreen. SUPER+M, SUPER+SHIFT+M and
# SUPER+CTRL+M (Keybinds.conf) switch a game to true, fake or dual-screen
# fullscreen by hand.
windowrule = fullscreen 0, match:tag games*

# PINNING
# Picture-in-Picture. The rules pin and keep_aspect_ratio work only while
# the window floats. Read the float rule in the FLOAT comment above.
windowrule = pin 1, match:title ^(Picture-in-Picture)$
windowrule = keep_aspect_ratio 1, match:title ^(Picture-in-Picture)$

#windowrule = bordercolor rgb(EE4B55) rgb(880808), match:fullscreen 1
#windowrule = bordercolor rgb(282737) rgb(1E1D2D), match:floating 1
#windowrule = opacity 0.8 0.8, pinned:1

# LAYER RULES
layerrule = blur 1, match:namespace rofi
layerrule = ignore_alpha 0, match:namespace rofi
layerrule = blur 1, match:namespace notifications
layerrule = ignore_alpha 0, match:namespace notifications

