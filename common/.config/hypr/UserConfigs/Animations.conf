# Curves and speeds follow Hyprland 0.55's own default animation set (the
# upstream Lua defaults, which this hyprlang config does not load, so each
# curve is redeclared here). Speed is in deciseconds: 1 = 100ms. Upstream
# uses a spring curve for windows; hyprlang cannot declare springs in
# 0.55.4, only the Lua config can, so easeOutQuint stands in for it.
# Natural feel comes from three rules: windows grow in place instead of
# flying in from a screen edge (popin, not slide), nothing overshoots its
# final size, and a closing window collapses to nothing in 50ms. popin 0%
# shrinks it to Hyprland's 5x5 px floor. The close snapshot has the border
# baked into its texture, so fadeOut is kept shorter than windowsOut: alpha
# reaches 0 before the box is small enough to look like a border speck.

animations {
  enabled = yes

  bezier = easeOutQuint, 0.23, 1, 0.32, 1
  bezier = almostLinear, 0.5, 0.5, 0.75, 1
  bezier = quick, 0.15, 0, 0.1, 1
  bezier = liner, 1, 1, 1, 1

  animation = windows, 1, 4.79, easeOutQuint
  animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
  animation = windowsOut, 1, 0.5, linear, popin 0%
  animation = windowsMove, 1, 2.5, easeOutQuint
  animation = border, 1, 5.39, easeOutQuint
  animation = borderangle, 1, 360, liner, loop #used by rainbow borders and rotating colors

  animation = fade, 1, 3.03, quick
  animation = fadeIn, 1, 1.73, almostLinear
  animation = fadeOut, 1, 0.3, easeOutQuint

  # Focus changes drive three fades at once here, because Decorations.conf
  # sets inactive_opacity 0.6, dim_inactive with dim_strength 0.2 and a
  # shadow color_inactive. Unset they inherited fade (300ms), which lagged
  # behind the keyboard; 240ms linear-ish keeps the swing smooth but prompt.
  animation = fadeSwitch, 1, 2.7, almostLinear
  animation = fadeDim, 1, 2.7, almostLinear
  animation = fadeShadow, 1, 2.7, almostLinear

  # Context menus and tooltips, previously also on the 300ms fade.
  animation = fadePopups, 1, 1.8, almostLinear

  # Layers are waybar, rofi and notification popups: they fade rather than
  # slide, so a launcher no longer shoots in from the edge of the screen.
  animation = layers, 1, 3.81, easeOutQuint
  animation = layersIn, 1, 4, easeOutQuint, fade
  animation = layersOut, 1, 1.5, linear, fade
  animation = fadeLayersIn, 1, 1.79, almostLinear
  animation = fadeLayersOut, 1, 1.39, almostLinear

  # slidefade keeps the direction of the workspace switch readable, unlike
  # upstream's plain fade, but drops the old overshoot bounce.
  animation = workspaces, 1, 1.94, almostLinear, slidefade 15%
  animation = workspacesIn, 1, 1.21, almostLinear, slidefade 15%
  animation = workspacesOut, 1, 1.94, almostLinear, slidefade 15%

  animation = zoomFactor, 1, 7, quick
}
