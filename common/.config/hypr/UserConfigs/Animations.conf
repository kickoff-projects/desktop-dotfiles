# The curves and the speeds follow the default animation set of Hyprland
# 0.55. Those defaults live in the upstream Lua config. This hyprlang
# config does not load that file, so this file declares every curve again.
# The speed unit is the decisecond: 1 is 100 ms.
# Upstream uses a spring curve for a window. hyprlang cannot declare a
# spring in 0.55.4, and only the Lua config can, so easeOutQuint takes its
# place.
#
# Three rules give the natural movement:
#  - A window grows in place. It does not fly in from the edge of the
#    screen, so these lines use popin and not slide.
#  - No window goes past its final size.
#  - A window that closes shrinks to nothing in 50 ms. popin 0% shrinks it
#    to the floor of Hyprland, which is 5 by 5 pixels.
# The close snapshot holds the border inside its texture. fadeOut is
# therefore shorter than windowsOut. The alpha value reaches 0 before the
# box is small enough to look like a speck of border.

animations {
  enabled = yes

  bezier = easeOutQuint, 0.23, 1, 0.32, 1
  bezier = almostLinear, 0.5, 0.5, 0.75, 1
  bezier = quick, 0.15, 0, 0.1, 1
  bezier = liner, 1, 1, 1, 1

  animation = windows, 1, 4.79, easeOutQuint
  animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
  animation = windowsOut, 1, 0.5, linear, popin 0%
  animation = windowsMove, 1, 2.5, easeOutQuint
  animation = border, 1, 5.39, easeOutQuint
  animation = borderangle, 1, 360, liner, loop #used by rainbow borders and rotating colors

  animation = fade, 1, 3.03, quick
  animation = fadeIn, 1, 1.73, almostLinear
  animation = fadeOut, 1, 0.3, easeOutQuint

  # A focus change starts 3 fades together. Decorations.conf sets
  # inactive_opacity to 0.6, dim_inactive with dim_strength 0.2, and a
  # shadow color_inactive. A near-linear 240 ms keeps the change smooth and
  # quick.
  animation = fadeSwitch, 1, 2.7, almostLinear
  animation = fadeDim, 1, 2.7, almostLinear
  animation = fadeShadow, 1, 2.7, almostLinear

  # Context menus and tooltips.
  animation = fadePopups, 1, 1.8, almostLinear

  # The layers are waybar, rofi and the notification popups. They fade, and
  # they do not slide, so a launcher does not come in from the edge of the
  # screen.
  animation = layers, 1, 3.81, easeOutQuint
  animation = layersIn, 1, 4, easeOutQuint, fade
  animation = layersOut, 1, 1.5, linear, fade
  animation = fadeLayersIn, 1, 1.79, almostLinear
  animation = fadeLayersOut, 1, 1.39, almostLinear

  # slidefade shows the direction of the workspace change. The plain fade of
  # upstream does not show it. slidefade also has no bounce at the end.
  animation = workspaces, 1, 1.94, almostLinear, slidefade 15%
  animation = workspacesIn, 1, 1.21, almostLinear, slidefade 15%
  animation = workspacesOut, 1, 1.94, almostLinear, slidefade 15%

  animation = zoomFactor, 1, 7, quick
}
