# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Colors: each account's own, from common/.config/hypr/UserConfigs/palette.conf
# or a host/user layer's override of it. This path used to be hardcoded to
# /home/nansus, so nansus-work never got a palette.
source = ~/.config/hypr/UserConfigs/palette.conf

general {
  border_size = 2
  gaps_in = 3
  gaps_out = 4
  
#  col.active_border = $color12
#  col.inactive_border = $color10
}

decoration {
  rounding = 12
         
  active_opacity = 1.0
  inactive_opacity = 0.6
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.2
  dim_special = 0.8

  shadow {
    enabled = true
    range = 3
    render_power = 4

#    color =  $color12
    color_inactive = $color12
  }


  blur {
    enabled = true
    size = 3
    passes = 4
    ignore_opacity = true
    new_optimizations = true
    special = true
    popups = true
  }
}

group {
#  col.border_active = $color15

	groupbar {
#		col.active = $color0
  }
}

