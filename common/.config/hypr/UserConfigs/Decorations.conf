# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Colors: each account's own, from common/.config/hypr/UserConfigs/palette.conf
# or a host/user layer's override of it. Was hardcoded to /home/nansus,
# which meant nansus-work never got a palette at all.
source = ~/.config/hypr/UserConfigs/palette.conf

general {
  border_size = 1
  gaps_in = 0
  gaps_out = 2
  
#  col.active_border = $color12
#  col.inactive_border = $color10
}

decoration {
  rounding = 12
         
  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0

  border_part_of_window = false

  dim_inactive = true
  dim_strength = 0.2
  dim_special = 0.8

  shadow {
    enabled = true
    range = 3
    render_power = 4

#    color =  $color12
    color_inactive = $color12
  }


  #blur {
  #  enabled = true
  #  # Hyprland's defaults, and its dual-Kawase blur costs 2 render passes per
  #  # blurred region per repaint at passes = 1. size is the sample distance
  #  # inside one level, passes is how many times the backdrop is halved and
  #  # re-grown, so the reach is about size x 2^passes: roughly 16 px here.
  #  size = 0
  #  passes = 1
  #  ignore_opacity = true
  #  new_optimizations = true
  #  special = true
  #  popups = true
  #}
}

group {
#  col.border_active = $color15

	groupbar {
#		col.active = $color0
  }
}

