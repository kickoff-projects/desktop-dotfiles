# The black and rainbow variant of
# common/.config/hypr/UserConfigs/palette.conf, for the nansus account. The
# Decorations.conf file beside this file sources it. The variable names are
# the same, so every line that uses $color<n> still works.
#
# $background is true black. Hyprland draws the inactive window border and
# the shadows with it. The $color slots hold the neon accents, in spectrum
# order. They match ../../waybar/colors.css.
#
# Every value uses the form rgb(RRGGBB), and not the form rgb(r, g, b).
# The spaces in the decimal form split the value into 3 tokens. A
# gradient option then fails with the message "failed to parse 0) as a
# color". Those options are col.active_border, col.inactive_border,
# group:col.* and groupbar:col.*. The shared palette.conf uses the same hex
# form.

$background = rgb(000000)
$foreground = rgb(f2f2f7)

$color0 = rgb(050505)  # near black
$color1 = rgb(121212)  # black, one step up
$color2 = rgb(ff2fb0)  # magenta
$color3 = rgb(c7a4ff)  # violet
$color4 = rgb(52b4ff)  # blue
$color5 = rgb(00e5ff)  # cyan
$color6 = rgb(00ff88)  # green
$color7 = rgb(ffe600)  # yellow
$color8 = rgb(ff7a00)  # orange
$color9 = rgb(ff3b30)  # red

# The second half repeats the accents, like the shared palette. A config
# line that uses an upper slot therefore still gets a colour.
$color10 = rgb(ff2fb0)
$color11 = rgb(c7a4ff)
$color12 = rgb(52b4ff)
$color13 = rgb(00e5ff)
$color14 = rgb(00ff88)
$color15 = rgb(ffe600)
