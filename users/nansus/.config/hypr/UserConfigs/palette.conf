# nansus: black/rainbow variant of
# common/.config/hypr/UserConfigs/palette.conf, sourced by this account's
# own Decorations.conf next to it. Same variable names, so anything that
# references $color<n> keeps working.
#
# $background is true black and is what the inactive window border and the
# shadows are drawn with; the $color slots are the neon accents, in
# spectrum order, matching ../../waybar/colors.css.
#
# Written as rgb(RRGGBB), not rgb(r, g, b): the spaces in the decimal form
# split the value into three tokens when it is fed to a gradient-typed
# option (col.active_border, col.inactive_border, group:col.*,
# groupbar:col.*), and hyprland then fails with "failed to parse 0) as a
# color". The shared palette.conf was rewritten to the same hex form after
# hitting the same failure on a plain (non-gradient) option.

$background = rgb(000000)
$foreground = rgb(f2f2f7)

$color0 = rgb(050505)  # near black
$color1 = rgb(121212)  # black, one step up
$color2 = rgb(ff2fb0)  # magenta
$color3 = rgb(c7a4ff)  # violet
$color4 = rgb(52b4ff)  # blue
$color5 = rgb(00e5ff)  # cyan
$color6 = rgb(00ff88)  # green
$color7 = rgb(ffe600)  # yellow
$color8 = rgb(ff7a00)  # orange
$color9 = rgb(ff3b30)  # red

# Second half repeats the accents the way the shared palette does, so a
# config line written against the upper slots still lands on a color.
$color10 = rgb(ff2fb0)
$color11 = rgb(c7a4ff)
$color12 = rgb(52b4ff)
$color13 = rgb(00e5ff)
$color14 = rgb(00ff88)
$color15 = rgb(ffe600)
