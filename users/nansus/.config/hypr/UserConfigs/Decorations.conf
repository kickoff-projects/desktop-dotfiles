# nansus: black/rainbow variant of
# common/.config/hypr/UserConfigs/Decorations.conf. Geometry (border_size,
# gaps, rounding, blur) is identical to the shared file - only the colors
# and the inactive-window treatment differ.

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# This account's own palette, from the palette.conf next to this file.
source = ~/.config/hypr/UserConfigs/palette.conf

general {
  border_size = 2
  gaps_in = 3
  gaps_out = 4

  # col.active_border is deliberately not set: Execs.conf's
  # smooth_RainbowBorder.sh assigns a random rainbow gradient to the
  # focused window at startup via hyprctl, and a runtime keyword outranks
  # anything written here. The inactive border is pinned to black instead,
  # so unfocused windows have no outline against the black desktop.
  col.inactive_border = $background
}

decoration {
  rounding = 12

  # No inactive dimming or transparency on this account - an unfocused
  # window looks exactly like the focused one, the random rainbow border
  # is the only thing marking focus.
  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0

  dim_inactive = false
  dim_strength = 0.0
  # Unrelated to inactive windows: this is the darkening applied behind an
  # open special workspace, kept as in the shared file.
  dim_special = 0.8

  shadow {
    enabled = true
    range = 3
    render_power = 4

    # Black rather than the shared file's blue, so windows sink into the
    # background instead of being outlined by a colored halo.
    color = rgba(000000ee)
    color_inactive = rgba(00000099)
  }

  blur {
    enabled = true
    size = 3
    passes = 4
    ignore_opacity = true
    new_optimizations = true
    special = true
    popups = true
  }
}

misc {
  # No wallpaper here, so this is the desktop.
  background_color = rgb(000000)
}

group {
  # Rainbow accent on a grouped window's active tab, black elsewhere.
  col.border_active = $color2
  col.border_inactive = $background

  groupbar {
    col.active = $color2
    col.inactive = $color0
    text_color = $foreground
  }
}
