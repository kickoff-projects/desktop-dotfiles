# The black and rainbow variant of
# common/.config/hypr/UserConfigs/Decorations.conf, for the nansus account.
# The geometry is the same as the shared file: border_size, the gaps, the
# rounding and the blur. Only the colours and the inactive window change.

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# The palette of this account. It comes from the palette.conf beside this
# file.
source = ~/.config/hypr/UserConfigs/palette.conf

general {
  border_size = 2
  gaps_in = 3
  gaps_out = 4

  # This file does not set col.active_border. The script
  # smooth_RainbowBorder.sh from Execs.conf gives the focused window a
  # random rainbow gradient at startup, through hyprctl. A keyword from
  # hyprctl wins over every line here.
  # The inactive border holds black instead, so an unfocused window shows
  # no outline against the black desktop.
  col.inactive_border = $background
}

decoration {
  rounding = 12

  # This account uses no dimming and no transparency for an inactive
  # window. An unfocused window looks the same as the focused window. Only
  # the random rainbow border marks the focus.
  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0

  dim_inactive = false
  dim_strength = 0.0
  # This value does not apply to an inactive window. It darkens the area
  # behind an open special workspace. It is the same as in the shared file.
  dim_special = 0.8

  shadow {
    enabled = true
    range = 3
    render_power = 4

    # Black, and not the blue of the shared file. A window then goes into
    # the background, and no coloured ring surrounds it.
    color = rgba(000000ee)
    color_inactive = rgba(00000099)
  }

  blur {
    enabled = true
    size = 3
    passes = 4
    ignore_opacity = true
    new_optimizations = true
    special = true
    popups = true
  }
}

misc {
  # This account uses no wallpaper, so this colour is the desktop.
  background_color = rgb(000000)
}

group {
  # A rainbow accent marks the active tab of a grouped window. Every other
  # tab is black.
  col.border_active = $color2
  col.border_inactive = $background

  groupbar {
    col.active = $color2
    col.inactive = $color0
    text_color = $foreground
  }
}

# The rainbow border marks the focus alone. See active_opacity and
# dim_inactive above.
# Those two options work at the decoration level, and an opacity rule for
# one window wins over them. The rules per tag in
# common/.config/hypr/UserConfigs/WindowRules.conf therefore need the same
# flat value.
# hyprland.conf sources that file before this file, and the last opacity
# rule that matches wins. These lines therefore cover every rule.
# These lines live here, and not in the shared file, so the nansus-work
# account keeps its opacity per application.
windowrule = opacity 1.0 1.0, match:class .*
